<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Motus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="notice" id="notice" hidden></div>
  <div class="top" id="top"></div>
  <table>
    <thead><tr><th>Day</th><th>Sleep</th><th>Steps</th><th>Cal</th><th>Kg</th><th>Lift</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="charts"></div>
  <div class="streaks" id="streaks"></div>
  <p class="muted" id="updated" style="font-size:12px"></p>
</main>

<script src="shared.js"></script>
<script>
const M = [
  { k: "sleep_hours", name: "Sleep", f: v => v.toFixed(1), met: v => v >= goals.sleep },
  { k: "steps", name: "Steps", f: v => Math.round(v).toLocaleString("en-US"), met: v => v >= goals.steps },
  { k: "calories", name: "Calories", f: v => Math.round(v).toLocaleString("en-US"), met: v => v <= goals.calories },
  { k: "weight_kg", name: "Weight", f: v => v.toFixed(1), met: () => false },
];
let days = {}, hevyTotal = null, streakBaseline = null;   // hevyTotal: all workouts in Hevy, from status.json

function avgRange(k, from, to) {               // mean of the days that have data, inclusive dates
  const v = [];
  for (let d = from; d <= to; d = add(d, 1)) { const x = (days[d] || {})[k]; if (x != null) v.push(x); }
  return v.length ? v.reduce((a, b) => a + b) / v.length : null;
}

function weightPerWeek() {                     // average weight since Sunday minus last week's average (kg); negative = losing
  const ws = weekStart(today), cur = weekAvg(days, "weight_kg"), prev = avgRange("weight_kg", add(ws, -7), add(ws, -1));
  return cur == null || prev == null ? null : cur - prev;
}

function workoutsBetween(from, to) {           // number of workouts, inclusive dates
  let n = 0;
  for (let d = from; d <= to; d = add(d, 1)) n += (days[d] || {}).workout_count || 0;
  return n;
}

function weekStrip(ws) {   // Sunday -> Saturday circles, filled on workout days
  const dots = Array.from({ length: 7 }, (_, i) => {
    const d = add(ws, i), done = ((days[d] || {}).workout_count || 0) > 0;
    const planned = goals.days.includes(new Date(d + "T00:00:00Z").getUTCDay());
    const cls = ["dot", done ? "on" : planned ? "plan" : "", d === today ? "today" : "", d > today ? "future" : ""].join(" ");
    const letter = new Date(d + "T00:00:00Z").toLocaleDateString("en-US", { weekday: "narrow", timeZone: "UTC" });
    return `<div class="wd"><small>${letter}</small><div class="${cls}">${+d.slice(8)}</div></div>`;
  }).join("");
  return `<div class="wide"><div class="week">${dots}</div></div>`;
}

function lastWeekLine(ws, workouts) {         // last week's averages; steps and weight also show the change vs the week before
  const from = add(ws, -7), to = add(ws, -1), pFrom = add(from, -7), pTo = add(from, -1);
  const sign = d => (d > 0 ? "+" : d < 0 ? "−" : "±");
  // value (+ change vs previous week's average when compare is set); green when it meets the standard
  const part = (k, fmt, unit, noun, dec, good, compare, changeUnit) => {
    const cur = avgRange(k, from, to);
    if (cur == null) return `<span class="no">no ${noun} data</span>`;
    const prev = compare ? avgRange(k, pFrom, pTo) : null;
    const d = prev == null ? null : cur - prev;
    const dTxt = d == null ? "" : ` (${sign(+d.toFixed(dec))}${fmt(Math.abs(d))}${changeUnit || ""})`;
    return `<span class="${good(cur, d) ? "good2" : ""}">${fmt(cur)} ${unit}${dTxt}</span>`;
  };
  const f1 = v => v.toFixed(1), f0 = v => Math.round(v).toLocaleString("en-US");
  return `<div class="wide lastweek"><small>Last Week: ` + [
    part("sleep_hours", f1, "h sleep", "sleep", 1, cur => cur >= goals.sleep, false),
    part("steps", f0, "steps", "step", 0, cur => cur >= goals.steps, true),
    part("calories", f0, "kcal", "calorie", 0, cur => cur <= goals.calories, false),
    part("weight_kg", f1, "kg", "weight", 1, (cur, d) => d != null && d < 0 && -d >= goals.weight, true, " kg"),
    `<span class="${workouts >= goals.workouts ? "good2" : ""}">${workouts} workout${workouts === 1 ? "" : "s"}</span>`,
  ].join(' <span class="sep">|</span> ') + "</small></div>";
}

function summary() {
  const cell = (val, text, green, sub, cls) =>
    `<div class="${cls || ""}"><b class="${green ? "good" : ""}">${val == null ? NO : text}</b><small>${sub}</small></div>`;
  const ws = weekStart(today);                 // weeks start on Sunday
  const sl = weekAvg(days, "sleep_hours"), st = weekAvg(days, "steps"), ca = weekAvg(days, "calories"), w = weightPerWeek();   // rules: see weekAvg in shared.js
  const loss = w == null ? null : -w;
  const wText = w == null ? "" : (w > 0 ? "+" : w < 0 ? "−" : "") + Math.abs(w).toFixed(1) + " kg";
  const lastWeek = workoutsBetween(add(ws, -7), add(ws, -1));
  const sundayLong = dayMonth(ws);
  document.getElementById("top").innerHTML =
    `<div class="wide"><small>Weekly avg (Since Sun, ${sundayLong})</small></div>` +
    cell(sl, sl == null ? "" : sl.toFixed(1) + " h", sl != null && sl >= goals.sleep, "Sleep") +
    cell(st, st == null ? "" : Math.round(st).toLocaleString("en-US"), st != null && st >= goals.steps, "Steps") +
    cell(ca, ca == null ? "" : Math.round(ca).toLocaleString("en-US"), ca != null && ca <= goals.calories, "Calories") +
    cell(w, wText, loss != null && loss > 0 && loss >= goals.weight,
         w == null ? "Weight per week" : "Weight per week, " + (w < 0 ? "lost" : w > 0 ? "gained" : "no change")) +
    weekStrip(ws) + lastWeekLine(ws, lastWeek);
}

// small marker on a value that was manually corrected; the title shows the automatic original
const edited = (r, ...keys) => {
  const k = keys.find(x => r.orig && x in r.orig);
  return k ? `<span class="ed" title="manually corrected; original ${r.orig[k] == null ? "no data" : r.orig[k]}">*</span>` : "";
};

function table() {
  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = add(today, -i), r = days[d] || {};
    const day = adminToken() ? `<a href="edit.html?date=${d}">${label(d)}</a>` : label(d);   // edit links only in an admin session
    html += `<tr><td>${day}</td>` + M.map(m => {
      const v = r[m.k];
      return v == null ? `<td>${NO}${edited(r, m.k)}</td>` : `<td class="${m.met(v) ? "good" : ""}">${m.f(v)}${edited(r, m.k)}</td>`;
    }).join("") +
      (r.workout_count ? `<td>${r.workout_minutes}m${edited(r, "workout_minutes", "workout_count")}</td>` : `<td class="muted">–${edited(r, "workout_count")}</td>`) + "</tr>";
  }
  document.getElementById("rows").innerHTML = html;
}

function chart(m) {
  const N = 30, W = 300, H = 48;
  const vals = Array.from({ length: N }, (_, i) => (days[add(today, i - N + 1)] || {})[m.k] ?? null);
  const have = vals.filter(v => v != null);
  const div = document.createElement("div");
  div.className = "chart";
  if (!have.length) { div.innerHTML = `<small>${m.name}</small> ${NO}`; return div; }
  const line = m.k === "weight_kg";
  let lo = line ? Math.min(...have) : 0, hi = Math.max(...have);
  if (line) { const p = (hi - lo) || 1; lo -= p * .3; hi += p * .3; } else hi *= 1.1;
  const y = v => H - 2 - (v - lo) / (hi - lo) * (H - 4), s = W / N;
  let g = "";
  if (line) {
    let p = "", pen = false;
    vals.forEach((v, i) => { if (v == null) { pen = false; return; } p += (pen ? "L" : "M") + (i * s + s / 2).toFixed(1) + " " + y(v).toFixed(1); pen = true; });
    g = `<path d="${p}" fill="none" stroke="currentColor" stroke-width="1.5"/>` +
        vals.map((v, i) => v == null ? "" : `<circle cx="${i * s + s / 2}" cy="${y(v)}" r="2" fill="currentColor"/>`).join("");
  } else {
    g = vals.map((v, i) => v == null ? "" :
      `<rect x="${i * s + 1}" y="${y(v)}" width="${s - 2}" height="${H - 2 - y(v)}" fill="${m.met(v) ? "var(--green)" : "currentColor"}"/>`).join("");
  }
  div.innerHTML = `<small>${m.name}, 30 days</small><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>`;
  return div;
}

// Streaks, at the very end of the page: calorie-logging streak with a 4-week calendar, and Hevy's lifetime workouts
// with a mini weekly chart (green = weeks that reached the workouts goal).
const ICON_FLAME = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 2c.7 3.4-1.3 5-2.9 6.9C7.4 10.8 6 12.7 6 15.2a6 6 0 0 0 12 0c0-2.3-1.1-4.2-2.4-5.6-.3 1.3-1.1 2.2-2.2 2.6.6-3.1-.1-7.7-1.4-10.2z"/></svg>';
const ICON_BELL = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>';
function renderStreaks() {
  const s = loggingStreak(days, today, streakBaseline), box = document.getElementById("streaks");
  const cal = streakGrid(days).map(c =>
    `<i class="${[c.logged ? "on" : "", c.today ? "today" : "", c.future ? "future" : ""].join(" ")}" title="${dayMonth(c.date)}"></i>`).join("");
  const note = s.current ? (s.fromApp ? "since " + dayMonth(s.start) + " " + s.start.slice(0, 4) + " \u00b7 MyFitnessPal" : s.capped ? "counted from " + dayMonth(s.start) : s.best > s.current ? "best " + s.best + " days" : "your best so far") : "log today to start one";
  let html = `<div class="tile"><div class="tl"><div class="big"><span class="icon">${ICON_FLAME}</span><b>${s.current}</b></div>` +
             `<span class="what">day logging streak</span><small>${note}</small></div><div class="cal" aria-hidden="true">${cal}</div></div>`;
  if (hevyTotal != null) {
    const wk = weeklyWorkouts(days, today, 12), hi = Math.max(goals.workouts, ...wk, 1);
    const bars = wk.map((c, i) => `<i class="${c >= goals.workouts ? "on" : ""}${i === wk.length - 1 ? " now" : ""}" style="height:${Math.max(4, c / hi * 100)}%" title="${c}"></i>`).join("");
    html += `<div class="tile"><div class="tl"><div class="big"><span class="icon">${ICON_BELL}</span><b>${hevyTotal.toLocaleString("en-US")}</b></div>` +
            `<span class="what">workouts in Hevy</span><small>last 12 weeks</small></div><div class="mini" aria-hidden="true">${bars}</div></div>`;
  }
  box.innerHTML = html;
}

function render() {
  summary(); table();
  try { renderStreaks(); } catch (e) { console.error("streaks", e); }   // optional section: never block the charts
  document.getElementById("charts").replaceChildren(...M.map(chart));
}

function showNotice(status) {
  const msgs = [], when = iso => new Date(iso).toLocaleString("en-US", { timeZone: TZ, weekday: "short", hour: "numeric", minute: "2-digit" });
  const hour = +new Intl.DateTimeFormat("en-GB", { hour: "numeric", hourCycle: "h23", timeZone: TZ }).format(new Date());
  if (!status) { msgs.push("No status information: automatic updates may not be running."); }
  else {
    const up = status.health && status.health.latest_upload;
    if (!up) msgs.push("No Health data has ever been uploaded from your phone.");
    else if (up.slice(0, 10) < today && hour >= 11) msgs.push(`No Health upload from your phone yet today (last: ${when(up)}). Run the Health to Drive shortcut.`);
    if (status.run && Date.now() - new Date(status.run) > 36 * 3600e3) msgs.push(`Automatic updates look paused (last run: ${when(status.run)}).`);
    (status.errors || []).slice(0, 2).forEach(e => msgs.push("Update problem: " + e));
  }
  const el = document.getElementById("notice");
  el.hidden = !msgs.length;
  el.textContent = msgs.join(" ");
}

// what each source last delivered, so a missing workout/upload is visible without digging through logs
function showFooter(data, status) {
  const when = iso => new Date(iso).toLocaleString("en-US", { timeZone: TZ, weekday: "short", hour: "numeric", minute: "2-digit" });
  const lines = [];
  if (data && data.updated) lines.push("Data changed " + new Date(data.updated).toLocaleString("en-US",
    { timeZone: TZ, month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }));
  if (status) {
    const hv = status.hevy || {}, hl = status.health || {};
    lines.push([
      "Hevy: " + (hv.latest_workout_start ? "last workout " + when(hv.latest_workout_start)
                 : hv.latest_workout ? "last workout " + label(hv.latest_workout) : "no workouts") + (hv.ok === false ? " (check failed)" : ""),
      "Health: " + (hl.latest_upload ? "last upload " + when(hl.latest_upload) : "no uploads"),
      status.run ? "checked " + when(status.run) : "",
    ].filter(Boolean).join(" · "));
  }
  document.getElementById("updated").innerHTML = lines.join("<br>");
}

initNav("home", render);
Promise.all([loadJSON("data.json"), loadJSON("status.json"), loadJSON("streaks.json")]).then(([data, status, streaks]) => {
  if (!data) {
    document.getElementById("updated").textContent = "Could not load data.json (open the site through a web server, not as a file).";
    data = { days: {} };
  }
  days = data.days || {};
  streakBaseline = streaks && streaks.mfp_logging_streak ? streaks.mfp_logging_streak : null;
  hevyTotal = status && status.hevy && status.hevy.total_workouts != null ? status.hevy.total_workouts : null;
  render();
  showNotice(status);
  showFooter(data, status);
});
</script>
</body>
</html>
